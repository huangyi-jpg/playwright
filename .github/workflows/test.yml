name: Playwright Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest # 使用 GitHub 提供的 Linux 虚拟机
    
    steps:
      - name: 拉取代码
        uses: actions/checkout@v5

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: 'pip' # 自动缓存 pip 依赖，加速构建

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      # ⭐ 核心步骤：安装 Playwright 无头浏览器及 Linux 系统依赖
      - name: 安装 Playwright 浏览器
        run: |
          playwright install chromium --with-deps
          
      # 可选优化：缓存 Playwright 浏览器（避免每次重新下载，节省时间）
      - name: 缓存 Playwright 浏览器
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements.txt') }}

      - name: 运行 Pytest 测试 (无头模式)
        run: |
          pytest tests/test_login.py --alluredir=allure-results
        continue-on-error: true 

      - name: 生成 Allure 报告
        if: always() 
        run: |
          npm install -g allure-commandline
          allure generate allure-results --clean -o allure-report

      - name: 上传 Allure 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-${{ github.run_number }}
          path: allure-report/
          retention-days: 30