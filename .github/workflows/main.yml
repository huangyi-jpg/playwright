name: Pytest API Automation

on:
  push:
    branches: [dev] # 当你推送到 dev 分支时自动触发（如果是 main 分支请修改）

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Build and run API (docker)
        run: |
          docker build -t my-api-image .
          docker run -d --name my-api -p 9091:9091 my-api-image
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:9091/health >/dev/null 2>&1; then
              echo "API ready"
              break
            fi
            sleep 1
          done
          
      - name: Run Pytest
        run: |
          pytest api_test -v --alluredir=allure-results
